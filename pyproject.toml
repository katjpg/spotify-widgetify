[project]
name = "spotify-widgetify"
version = "0.1.0"
description = "spotify widget for displaying current played song."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pillow>=10.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]
