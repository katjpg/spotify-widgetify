<svg width="495" height="160" viewBox="0 0 495 160" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <foreignObject width="100%" height="100%">
      <div xmlns="http://www.w3.org/1999/xhtml" class="container">
        {% set fg = css.base_text if has_color else palette.text %}
        <style>
          {% include "base.css" %}

          /* Main Widget Container */
          main {
            display: flex;
            padding: {{ css.container_padding }};
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            height: 120px;
            width: 440px;
            --fg: {{ fg }};
            {% if has_color %}
            background: {{ css.background_color }};
            {% else %}
            background: #000;
            {% endif %}
          }

          /* layer 1: blurred cover = color field */
          .cover-blur {
            position: absolute;
            inset: -30px;
            background: url("data:image/png;base64,{{ base_64_track_image }}") center / cover;
            filter: blur(32px) saturate(1.5) brightness(1.0);  /* brightness lifts dark covers */
            transform: scale(1.2);
            z-index: 0;
          }

          /* layer 2: soft white frost bloom over a faint veil */
          .cover-tint {
            position: absolute;
            inset: 0;
            background:
              radial-gradient(130px 100px at 24% 20%, rgba(255, 255, 255, 0.12), transparent 100%),
              radial-gradient(150px 120px at 80% 76%, rgba(255, 255, 255, 0.08), transparent 100%),
              radial-gradient(110px 90px at 60% 44%, rgba(255, 255, 255, 0.05), transparent 96%),
              linear-gradient(rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)),
              linear-gradient(rgba(0, 0, 0, 0.10), rgba(0, 0, 0, 0.22));  /* faint dark wash under the frost */
            z-index: 0;
            pointer-events: none;
          }

          /* Content Container */
          aside {
            width: 100%;
            display: flex;
            position: relative;
            z-index: 1;
          }

          /* Album Cover */
          .cover {
            width: 120px;
            height: 120px;
            border-radius: {{ css.album_border_radius }};
            {% if spin %}animation: spin 10s linear infinite;{% endif %}
          }

          /* Info Section */
          section {
            flex: 1;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
          }

          /* Container for both track info and equalizer */
          .content-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex: 1;
          }

          /* Track Info */
          .track-info {
            font-family: {{ css.text_font }};
            max-width: 164px;
            margin-bottom: -36px;
          }

          /* Song Title */
          .track-name {
            font-size: 20px;
            font-weight: 500;
            color: var(--fg);
            margin-bottom: 4px;
            max-width: 164px;
            --marquee-distance: min(0px, calc(-100% + 164px));
          }

          /* Artist Name */
          .track-artist {
            font-size: 14px;
            color: var(--fg);
            opacity: 0.85;
            max-width: 164px;
          }

          /* Header with logo */
          .header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
          }

          /* Spotify Logo */
          .logo {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            filter: brightness(0){% if fg == '#FFFFFF' %} invert(1){% endif %};
          }

          .now-playing {
            font-family: {{ css.text_font }};
            font-size: 14px;
            color: var(--fg);
            opacity: 0.7;
          }

          /* Improved Equalizer */
          {% if show_equalizer %}
          .equalizer {
            display: inline-flex;
            align-items: center;
            height: 50px;
            gap: 6px;
            margin-right: 10px;
            margin-bottom: -42px;
          }

          .bar {
            width: 4px;
            height: 8px; /* Default height */
            border-radius: 50px;
            background: var(--fg);
            transform-origin: center;
            animation: bidirectionalWave 1.5s ease-in-out infinite;
          }

          @keyframes bidirectionalWave {
            0%, 100% {
              transform: scaleY(0.1);
            }
            50% {
              transform: scaleY(3.0);
            }
          }

          /* Create the wave pattern with animation delays */
          .bar:nth-child(1) { animation-delay: 1s; }
          .bar:nth-child(2) { animation-delay: 0.8s; }
          .bar:nth-child(3) { animation-delay: 0.6s; }
          .bar:nth-child(4) { animation-delay: 0.4s; }
          .bar:nth-child(5) { animation-delay: 0.2s; }
          .bar:nth-child(6) { animation-delay: 0.2s; }
          .bar:nth-child(7) { animation-delay: 0.4s; }
          .bar:nth-child(8) { animation-delay: 0.6s; }
          .bar:nth-child(9) { animation-delay: 0.8s; }
          .bar:nth-child(10) { animation-delay: 1s; }
          {% endif %}

        </style>

        <a href="https://open.spotify.com/track/{{ track_id }}" target="_blank">
          <main>
            {% if not has_color %}<div class="cover-blur"></div><div class="cover-tint"></div>{% endif %}

            <aside>
              <img
                class="cover"
                src="data:image/png;base64,{{ base_64_track_image }}"
                alt="{{ track_name }} by {{ track_artist }}"
              />

              <section>
                <!-- Header with Now Playing text and Spotify logo -->
                <div class="header">
                  <img class="logo" src="data:image/svg+xml;base64,{{ logo }}" alt="Spotify" />
                  <div class="now-playing">Now Playing</div>
                </div>

                <div class="content-wrapper">
                  <div class="track-info">
                    <div class="track-name marquee-wrapper"><span class="marquee">{{ track_name }}</span></div>
                    <div class="track-artist text-ellipsis">{{ track_artist }}</div>
                  </div>

                  {% if show_equalizer %}
                  <div class="equalizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                  </div>
                  {% endif %}
                </div>
              </section>
            </aside>
          </main>
        </a>
      </div>
    </foreignObject>
  </svg>
